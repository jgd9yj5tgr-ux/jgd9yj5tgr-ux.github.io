name: Build and publish FlyCraft

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Apply FlyCraft starter changes
        shell: bash
        run: |
          if [ ! -f FlyCraft-v0.2-patch.zip ]; then
            echo "FlyCraft-v0.2-patch.zip is missing from the repository root."
            exit 1
          fi
          mkdir -p /tmp/flycraft-patch
          unzip -q -o FlyCraft-v0.2-patch.zip -d /tmp/flycraft-patch
          cp -a /tmp/flycraft-patch/flycraft-changes/web/. web/
          cp /tmp/flycraft-patch/flycraft-changes/FLYCRAFT-START-HERE.md ./FLYCRAFT-START-HERE.md
          cp /tmp/flycraft-patch/flycraft-changes/README-upstream-plus-FlyCraft.md ./README.md

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build static website
        working-directory: web
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN }}

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

